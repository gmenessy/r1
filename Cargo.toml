[package]
name = "vibe-editor"
version = "0.1.0"
edition = "2021"
description = "AI-powered CLI text workbench with agentic UX (TUI)"
license = "MIT"

[[bin]]
name = "vibe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
docx-rs = { version = "0.4", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
